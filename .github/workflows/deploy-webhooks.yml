name: Deploy webhooks

on:
  push:
    branches: [main]
    paths:
      - "webhooks/**"
      - "app/db.server.ts"
      - "app/shopify.server.ts"
      - "app/shopify-app-session-storage-prisma.js"
      - "app/order-import-pending.server.ts"
      - "prisma/**"
      - "prisma.config.ts"
      - "certs/**"
      - "Dockerfile.worker"
      - ".dockerignore"
      - "package.json"
      - "yarn.lock"
      - "tsconfig.json"
      - ".github/workflows/deploy-webhooks.yml"
  workflow_dispatch:

env:
  PROJECT_ID: record-loft
  REGION: us-central1
  SERVICE: shopify-webhooks
  REGISTRY: us-central1-docker.pkg.dev/record-loft/webhooks
  IMAGE_NAME: shopify-webhooks

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma generate

      - name: Test
        run: yarn test

      - name: Typecheck
        run: yarn typecheck

  migrate:
    needs: test
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Check migrate secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ] || [ -z "${{ secrets.DIRECT_URL }}" ]; then
            echo "Set GitHub secrets DATABASE_URL and DIRECT_URL (Aiven)."
            echo "See docs/deploy-webhooks.md"
            exit 1
          fi

      - name: Migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: yarn prisma migrate deploy

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Workload Identity vars
        run: |
          if [ -z "${{ vars.GCP_WIF_PROVIDER }}" ] || [ -z "${{ vars.GCP_DEPLOY_SA }}" ]; then
            echo "Set GitHub variables GCP_WIF_PROVIDER and GCP_DEPLOY_SA."
            echo "See docs/deploy-webhooks.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --no-allow-unauthenticated \
            --concurrency=1 \
            --max-instances=2 \
            --timeout=60 \
            --port=8080
