# Used by gcloud builds submit when `gcloud run deploy --dockerfile` is unavailable.
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/record-loft/webhooks/shopify-webhooks:latest
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.worker", "-t", "${_IMAGE}", "."]
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
